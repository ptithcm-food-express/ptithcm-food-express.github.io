<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web</title>
    <style>
        /* Xóa bỏ khoảng trắng mặc định của trang */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Ẩn thanh cuộn của trang cha */
        }

        /* Ép iframe phủ kín toàn bộ màn hình */
        .full-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe src="https://pfe.nnquangpro.com" class="full-frame"></iframe>

</body>
</html>
